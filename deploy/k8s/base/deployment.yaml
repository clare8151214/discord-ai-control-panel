apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-ai
  labels:
    app.kubernetes.io/name: discord-ai
spec:
  # Every profile owns a Discord gateway session and SQLite database. Do not
  # horizontally scale this deployment or overlap old/new pods during updates.
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: discord-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: discord-ai
    spec:
      serviceAccountName: discord-ai
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-panel
          image: discord-ai-control-panel:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: discord-ai-config
          env:
            - name: CONTROL_PANEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: discord-ai-auth
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data/control-panel
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: discord-ai-data
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
