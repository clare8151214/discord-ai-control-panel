apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: discord-ai-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # Uses the cluster's default StorageClass. For a cluster without a default,
  # choose a StorageClass in a Kustomize overlay before applying.
