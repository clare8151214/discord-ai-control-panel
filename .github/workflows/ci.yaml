name: CI and container publish

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest httpx pytest-asyncio
      - name: Test
        run: python -m pytest -q tests
      - name: Compile Python and check browser JavaScript
        shell: bash
        run: |
          python -m compileall -q bot.py check.py history_archive.py image_generation.py tts.py desktop_entry.py desktop providers web scripts
          while IFS= read -r -d '' script; do node --check "$script"; done < <(find web -name '*.js' -type f -print0)
      - name: Check Kubernetes manifests
        shell: bash
        run: |
          tools_dir="$RUNNER_TEMP/discord-ai-ci-tools"
          mkdir -p "$tools_dir"
          curl --fail --silent --show-error --location --output "$tools_dir/kubeconform-linux-amd64.tar.gz" https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          curl --fail --silent --show-error --location --output "$tools_dir/CHECKSUMS" https://github.com/yannh/kubeconform/releases/download/v0.8.0/CHECKSUMS
          (cd "$tools_dir" && grep '  kubeconform-linux-amd64.tar.gz$' CHECKSUMS | sha256sum --check)
          tar --extract --gzip --file "$tools_dir/kubeconform-linux-amd64.tar.gz" --directory "$tools_dir" kubeconform
          kubectl kustomize deploy/k8s/base > /tmp/base.yaml
          python scripts/render_k8s.py --image ghcr.io/example/discord-ai:sha-${GITHUB_SHA} > /tmp/rendered.yaml
          "$tools_dir/kubeconform" -strict -summary -kubernetes-version 1.37.0 /tmp/base.yaml /tmp/rendered.yaml deploy/k8s/ci-rbac.yaml

  container:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Build container
        run: docker build --pull --tag discord-ai-control-panel:ci --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" --label "org.opencontainers.image.revision=${GITHUB_SHA}" .
      - name: Start container with production filesystem restrictions
        run: |
          docker volume create discord-ai-ci-data
          docker run --detach --name discord-ai-ci --read-only --tmpfs /tmp:rw,nosuid,nodev,size=256m --cap-drop ALL --security-opt no-new-privileges:true --publish 127.0.0.1:18080:8080 --env CONTROL_PANEL_PASSWORD=ci-only-password-no-real-secrets --mount source=discord-ai-ci-data,target=/data/control-panel discord-ai-control-panel:ci
      - name: Verify authenticated API and persistent data across restart
        env:
          CONTROL_PANEL_PASSWORD: ci-only-password-no-real-secrets
        run: |
          python3 scripts/container_smoke.py --phase create
          docker restart --timeout 30 discord-ai-ci
          python3 scripts/container_smoke.py --phase verify
      - name: Show failure diagnostics
        if: failure()
        run: docker logs discord-ai-ci
      - name: Stop test container
        if: always()
        run: docker rm --force discord-ai-ci || true
      - name: Publish the tested image to GHCR
        if: vars.PUBLISH_CONTAINER == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag discord-ai-control-panel:ci "${image}:sha-${GITHUB_SHA}"
          docker push "${image}:sha-${GITHUB_SHA}"
          printf 'Published `%s:sha-%s`\n' "$image" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
