name: Windows desktop executable

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-desktop:
    # Binary distribution is opt-in; first satisfy third-party source obligations.
    if: vars.ENABLE_WINDOWS_BUILD == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-desktop.txt
      - name: Test, build the single EXE and verify both frozen entry points
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1 -Python python -VenvDir "$env:RUNNER_TEMP/desktop-build-venv" -BuildRoot "$env:RUNNER_TEMP/desktop-build" -OutputDir "$env:GITHUB_WORKSPACE/dist" -DownloadFFmpeg
      - name: Verify release checksums
        shell: pwsh
        run: |
          Get-Content dist/SHA256SUMS.txt | ForEach-Object {
            $expected, $name = $_ -split '  ', 2
            if ((Get-FileHash -LiteralPath (Join-Path dist $name) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
              throw "Checksum mismatch: $name"
            }
          }
      - name: Upload verified Windows download and license archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: DiscordAIControlPanel-Windows-x64
          path: |
            dist/DiscordAIControlPanel.exe
            dist/DiscordAIControlPanel-Windows-x64.zip
            dist/SHA256SUMS.txt
            dist/desktop-self-test.json
            dist/bot-self-test.json
            dist/bundle-verification.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload failed-build diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-build-diagnostics
          path: |
            ${{ runner.temp }}/desktop-build/run-*/**/*self-test.json
            ${{ runner.temp }}/desktop-build/run-*/bundle-verification.json
            ${{ runner.temp }}/desktop-build/run-*/**/*.log
            ${{ runner.temp }}/desktop-build/run-*/build/**/warn-*.txt
          if-no-files-found: ignore

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows-desktop
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      # GitHub CLI is preinstalled on windows-latest. Download through the API
      # rather than adding a separate release action with an additional token.
      - name: Attach the tested artifacts to a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run download $env:RUN_ID --name DiscordAIControlPanel-Windows-x64 --dir release-assets
          if ($LASTEXITCODE -ne 0) { throw "Could not download tested build artifacts" }
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title "Discord AI Control Panel $env:RELEASE_TAG" --notes "Windows x64 desktop build. Download the ZIP for executable and third-party licenses. Maintainers: satisfy the exact bundled FFmpeg build's GPL corresponding-source requirements before publishing this draft. See docs/windows-desktop.md."
            if ($LASTEXITCODE -ne 0) { throw "Could not create draft release" }
          }
          $isDraft = gh release view $env:RELEASE_TAG --json isDraft --jq '.isDraft'
          if ($LASTEXITCODE -ne 0 -or $isDraft -ne 'true') {
            throw "This workflow only attaches binaries to draft releases. The existing release is already published."
          }
          $assets = Get-ChildItem -LiteralPath release-assets -File | ForEach-Object { $_.FullName }
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload release assets" }
